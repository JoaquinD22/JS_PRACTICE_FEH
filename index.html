<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice FEH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"; rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <details ontoggle="message()">
            <summary>Instruction</summary>
            <i>enter 2 numbers then find its answer</i>
        </details>

        <form>
            <label>Enter 1st number </label>
            <input type="number" id="num1" placeholder="type here...">
            <br>
            <label>Enter 2nd number </label>
            <input type="number" id="num2" placeholder="type here...">
            <br>
            <br>
            <button type="button" onclick="plus()">Calculate ( + )</button>
            <h1 id="Result"></h1>
            <br>
            <button type="button" onclick="minus()">Calculate ( - )</button>
            <h1 id="SIGMA"></h1>
        </form>
    </div>
    <script>
        function message(){
            alert("cool");
        }

        function plus(){
            var add1 = document.getElementById ("num1").value
            var add2 = document.getElementById ("num2").value
            var sum = Number(add1) + Number(add2);
            document.getElementById('Result').innerHTML = 'Answer is' + ' ' + sum;
        }

            function minus(){
            var minus1 = document.getElementById ("num1").value
            var minus2 = document.getElementById ("num2").value
            var ans = Number(minus1) - Number(minus2);
            document.getElementById('SIGMA').innerHTML = 'Answer is' + ' ' + ans;
        }

        


    </script>
   
</body>
</html>
